services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uchfyd}
      POSTGRES_USER: ${POSTGRES_USER:-uchfyd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uchfyd -d uchfyd"]
      interval: 5s
      timeout: 4s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@correo.com
      PGADMIN_DEFAULT_PASSWORD: TuPasswordSeguro123
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres: { condition: service_healthy }

  identity-admin:
    build: .
    command: ["node", "services/identity-admin/server.js"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret-before-deploy}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-dev-only-change-this-internal-key}
      MONGODB_URL: ${MONGODB_URL:?MONGODB_URL es obligatorio para MongoDB Atlas}
      CATALOG_URL: http://catalog:4102
      ORDERS_URL: http://orders:4103
      IDENTITY_PORT: 4101
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@uchfyd.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-local-admin-password}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4101/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 12

  catalog:
    build: .
    command: ["node", "services/catalog/server.js"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-dev-only-change-this-internal-key}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-uchfyd}
      POSTGRES_USER: ${POSTGRES_USER:-uchfyd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
      CATALOG_PORT: 4102
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4102/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 12

  orders:
    build: .
    command: ["node", "services/orders/server.js"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret-before-deploy}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-dev-only-change-this-internal-key}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-uchfyd}
      POSTGRES_USER: ${POSTGRES_USER:-uchfyd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
      ORDERS_PORT: 4103
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4103/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 12

  gateway:
    build: .
    command: ["node", "services/gateway/server.js"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GATEWAY_PORT: 4100
      IDENTITY_URL: http://identity-admin:4101
      CATALOG_URL: http://catalog:4102
      ORDERS_URL: http://orders:4103
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5500,http://127.0.0.1:5500,null}
    ports:
      - "4100:4100"
    depends_on:
      identity-admin: { condition: service_healthy }
      catalog: { condition: service_healthy }
      orders: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 12

  web:
    build: ../uch-fyd-frontend
    ports:
      - "5173:80"
    depends_on:
      gateway: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
